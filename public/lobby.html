<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de espera – CaraCaca 💩</title>
  <meta name="description" content="Sala de espera de CaraCaca. Comparte el código con tus amigos y empieza la partida.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://caracaca.com/">

  <!-- Open Graph (por si alguien comparte el link de sala) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://caracaca.com/">
  <meta property="og:title" content="¡Te invito a jugar CaraCaca! 💩">
  <meta property="og:description" content="Únete a mi partida de CaraCaca, el juego de cartas online más cochino. Sin registro, sin descarga.">
  <meta property="og:image" content="https://caracaca.com/og-image.png">
  <meta property="og:image:alt" content="CaraCaca – juego de cartas multijugador online">
  <meta property="og:site_name" content="CaraCaca">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="¡Te invito a jugar CaraCaca! 💩">
  <meta name="twitter:description" content="Únete a mi partida de CaraCaca. Sin registro, sin descarga.">
  <meta name="twitter:image" content="https://caracaca.com/og-image.png">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <meta name="theme-color" content="#1a6b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Rendimiento -->
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="dns-prefetch" href="https://www.google-analytics.com">
  <link rel="stylesheet" href="/css/style.css">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P12JZY6FH1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-P12JZY6FH1');
  </script>
</head>
<body class="page-lobby">
  <div class="lobby-container">
    <div class="lobby-header">
      <h1>💩 Sala de Espera</h1>
      <div class="room-code-box">
        <span class="room-label">Código de sala</span>
        <span class="room-code" id="room-code">------</span>
        <button class="btn btn-ghost btn-sm" id="btn-copy-link">📋 Copiar enlace</button>
      </div>
      <!-- Invite section (shown once host has a room code) -->
      <div class="invite-section hidden" id="invite-section">
        <button class="btn-invite" id="btn-invite">📸 Invitar por Instagram</button>
      </div>
    </div>

    <div class="players-section">
      <h2>Jugadores (<span id="player-count">0</span>/9)</h2>
      <ul id="player-list" class="player-list"></ul>
    </div>

    <div class="lobby-actions">
      <button class="btn btn-primary btn-lg hidden" id="btn-start">🚀 ¡Iniciar partida!</button>
      <button class="btn btn-express hidden" id="btn-express">⚡ Partida Express</button>
      <button class="btn btn-secondary hidden" id="btn-add-bot">🤖 Agregar Bot</button>
      <p class="waiting-msg" id="waiting-msg">Esperando al anfitrión...</p>
    </div>

    <div class="lobby-footer">
      <button class="btn btn-ghost btn-sm" id="btn-back">🏠 Volver al inicio</button>
    </div>

    <div id="error-msg" class="error-msg hidden"></div>
  </div>

  <!-- Invite share modal -->
  <div class="invite-backdrop hidden" id="invite-backdrop">
    <div class="invite-modal">
      <h3>📸 Invitar por Instagram</h3>
      <p>Genera una historia lista para compartir.<br>¡Tus amigos podrán unirse escaneando el QR o con el código!</p>
      <canvas id="invite-preview-canvas" class="invite-preview" width="108" height="192" style="display:none"></canvas>
      <div id="invite-loading" style="color:#aaa;padding:20px 0">Generando imagen...</div>
      <div class="btn-group">
        <button class="btn btn-invite" id="btn-share-invite">📤 Compartir imagen</button>
        <button class="btn btn-ghost btn-sm" id="btn-close-invite">✕ Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Hidden full-res canvas for share.js -->
  <canvas id="share-canvas" style="display:none"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="/js/share.js"></script>
  <script src="/js/lobby.js"></script>
</body>
</html>
